<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Map App</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .search-box {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      z-index: 1000;
      display: flex;
      gap: 8px;
    }

    #search {
      flex: 1;
      height: 48px;
      border: none;
      border-radius: 25px;
      padding: 0 18px;
      font-size: 16px;
      box-shadow: 0 2px 10px #777;
      outline: none;
    }

    .search-btn {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: white;
      font-size: 21px;
      box-shadow: 0 2px 10px #777;
    }

    .location-btn {
      position: absolute;
      right: 20px;
      bottom: 30px;
      z-index: 1000;
      width: 58px;
      height: 58px;
      border: none;
      border-radius: 50%;
      background: white;
      font-size: 25px;
      box-shadow: 0 2px 10px #777;
    }
  </style>
</head>

<body>

  <div class="search-box">
    <input
      id="search"
      type="text"
      placeholder="സ്ഥലം Search ചെയ്യുക..."
    >

    <button class="search-btn" onclick="searchPlace()">
      🔍
    </button>
  </div>

  <button class="location-btn" onclick="myLocation()">
    📍
  </button>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>

    const defaultLocation = [20.5937, 78.9629];

    const map = L.map("map").setView(defaultLocation, 5);

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "© OpenStreetMap"
      }
    ).addTo(map);

    let marker = L.marker(defaultLocation)
      .addTo(map)
      .bindPopup("My Map App");

    // SEARCH
    async function searchPlace() {

      const query = document.getElementById("search").value.trim();

      if (!query) {
        alert("സ്ഥലത്തിന്റെ പേര് എഴുതൂ.");
        return;
      }

      try {

        const url =
          "https://nominatim.openstreetmap.org/search?format=json&q="
          + encodeURIComponent(query);

        const response = await fetch(url, {
          headers: {
            "Accept": "application/json"
          }
        });

        const data = await response.json();

        if (data.length === 0) {
          alert("സ്ഥലം കണ്ടെത്താൻ കഴിഞ്ഞില്ല.");
          return;
        }

        const place = data[0];

        const lat = parseFloat(place.lat);
        const lon = parseFloat(place.lon);

        map.setView([lat, lon], 16);

        marker.setLatLng([lat, lon]);

        marker
          .bindPopup("📍 " + place.display_name)
          .openPopup();

      } catch (error) {

        alert("Search ചെയ്യാൻ കഴിഞ്ഞില്ല. Internet പരിശോധിക്കൂ.");

      }
    }

    // ENTER KEY SEARCH
    document.getElementById("search").addEventListener(
      "keypress",
      function(event) {

        if (event.key === "Enter") {
          searchPlace();
        }

      }
    );

    // MY LOCATION
    function myLocation() {

      if (!navigator.geolocation) {
        alert("ഈ ഫോണിൽ Location support ഇല്ല.");
        return;
      }

      navigator.geolocation.getCurrentPosition(

        function(position) {

          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          map.setView([lat, lon], 17);

          marker.setLatLng([lat, lon]);

          marker
            .bindPopup("📍 നിങ്ങളുടെ സ്ഥലം")
            .openPopup();

        },

        function() {

          alert("Location permission അനുവദിക്കണം.");

        }

      );
    }

  </script>

</body>
</html>
