<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Map App</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .search-box {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      z-index: 1000;
      background: white;
      padding: 10px;
      border-radius: 18px;
      box-shadow: 0 2px 10px #777;
    }

    .search-box input {
      width: 100%;
      height: 45px;
      border: 1px solid #ddd;
      border-radius: 22px;
      padding: 0 15px;
      font-size: 16px;
      outline: none;
    }

    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    button {
      flex: 1;
      height: 42px;
      border: none;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 1px 5px #999;
      font-size: 15px;
    }

    .route-btn {
      background: #222;
      color: white;
    }

    .location-btn {
      position: absolute;
      right: 20px;
      bottom: 30px;
      z-index: 1000;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: white;
      font-size: 24px;
    }
  </style>
</head>

<body>

  <div class="search-box">

    <input
      id="search"
      type="text"
      placeholder="Destination Search ചെയ്യുക..."
    >

    <div class="buttons">
      <button onclick="searchPlace()">🔍 Search</button>
      <button class="route-btn" onclick="makeRoute()">🚗 Route</button>
    </div>

  </div>

  <button class="location-btn" onclick="myLocation()">
    📍
  </button>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

  <script>

    const defaultLocation = [20.5937, 78.9629];

    const map = L.map("map").setView(defaultLocation, 5);

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "© OpenStreetMap"
      }
    ).addTo(map);

    let currentLocation = null;
    let destination = null;
    let marker = null;
    let routeControl = null;

    // SEARCH DESTINATION
    async function searchPlace() {

      const query =
        document.getElementById("search").value.trim();

      if (!query) {
        alert("Destination എഴുതൂ.");
        return;
      }

      try {

        const url =
          "https://nominatim.openstreetmap.org/search?format=json&q="
          + encodeURIComponent(query);

        const response = await fetch(url);

        const data = await response.json();

        if (data.length === 0) {
          alert("സ്ഥലം കണ്ടെത്താൻ കഴിഞ്ഞില്ല.");
          return;
        }

        const place = data[0];

        destination = [
          parseFloat(place.lat),
          parseFloat(place.lon)
        ];

        map.setView(destination, 15);

        if (marker) {
          map.removeLayer(marker);
        }

        marker = L.marker(destination)
          .addTo(map)
          .bindPopup("🏁 " + place.display_name)
          .openPopup();

      } catch (error) {

        alert("Search failed.");

      }
    }

    // CURRENT LOCATION
    function myLocation() {

      if (!navigator.geolocation) {
        alert("Location support ഇല്ല.");
        return;
      }

      navigator.geolocation.getCurrentPosition(

        function(position) {

          currentLocation = [
            position.coords.latitude,
            position.coords.longitude
          ];

          map.setView(currentLocation, 16);

          if (marker) {
            map.removeLayer(marker);
          }

          marker = L.marker(currentLocation)
            .addTo(map)
            .bindPopup("📍 നിങ്ങളുടെ സ്ഥലം")
            .openPopup();

        },

        function() {
          alert("Location permission അനുവദിക്കണം.");
        }

      );
    }

    // CREATE ROUTE
    function makeRoute() {

      if (!currentLocation) {
        alert("ആദ്യം 📍 Location അമർത്തൂ.");
        return;
      }

      if (!destination) {
        alert("ആദ്യം Destination Search ചെയ്യൂ.");
        return;
      }

      if (routeControl) {
        map.removeControl(routeControl);
      }

      routeControl = L.Routing.control({

        waypoints: [

          L.latLng(
            currentLocation[0],
            currentLocation[1]
          ),

          L.latLng(
            destination[0],
            destination[1]
          )

        ],

        routeWhileDragging: false,

        showAlternatives: true,

        language: "en",

        createMarker: function() {
          return null;
        }

      }).addTo(map);
    }

  </script>

</body>
</html>
