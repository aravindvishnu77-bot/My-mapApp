<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Map App</title>

  <!-- Leaflet Map -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* Top interface */
    .top-panel {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 94%;
      max-width: 520px;
      z-index: 1000;
    }

    .title {
      background: white;
      padding: 12px 18px;
      border-radius: 25px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 3px 12px rgba(0,0,0,0.3);
      margin-bottom: 10px;
    }

    .search-box {
      display: flex;
      background: white;
      border-radius: 30px;
      padding: 5px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.3);
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      padding: 12px 15px;
      font-size: 16px;
      border-radius: 25px;
    }

    .search-btn {
      border: none;
      background: #4285f4;
      color: white;
      border-radius: 25px;
      padding: 0 20px;
      font-size: 16px;
      font-weight: bold;
    }

    .search-btn:active {
      transform: scale(0.96);
    }

    /* Bottom buttons */
    .bottom-buttons {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 94%;
      max-width: 520px;
      display: flex;
      gap: 10px;
      z-index: 1000;
    }

    .bottom-buttons button {
      flex: 1;
      border: none;
      padding: 14px 10px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: bold;
      box-shadow: 0 3px 12px rgba(0,0,0,0.3);
    }

    .location-btn {
      background: white;
      color: #222;
    }

    .route-btn {
      background: #111;
      color: white;
    }

    /* Loading */
    .loading {
      display: none;
      position: absolute;
      top: 145px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2000;
      background: white;
      padding: 10px 18px;
      border-radius: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
      font-size: 14px;
    }

    /* Map type button */
    .map-type {
      position: absolute;
      right: 15px;
      top: 180px;
      z-index: 1000;
      background: white;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
      font-size: 14px;
      font-weight: bold;
    }

    @media (max-width: 500px) {

      .title {
        font-size: 18px;
      }

      .search-box input {
        font-size: 15px;
      }

      .search-btn {
        padding: 0 15px;
      }

      .bottom-buttons button {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- Top panel -->
  <div class="top-panel">

    <div class="title">
      🗺️ My Map App
    </div>

    <div class="search-box">

      <input
        id="searchInput"
        type="text"
        placeholder="Search places or streets..."
      >
