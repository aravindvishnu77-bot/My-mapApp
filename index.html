<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>എന്റെ മാപ്പ്</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:Arial,sans-serif;
}

#map{
  width:100%;
  height:100vh;
}

.panel{
  position:absolute;
  z-index:1000;
  top:15px;
  left:15px;
  right:15px;
  background:white;
  padding:14px;
  border-radius:22px;
  box-shadow:0 4px 18px rgba(0,0,0,.25);
}

.row{
  display:flex;
  gap:10px;
}

#searchInput{
  flex:1;
  height:56px;
  border:1px solid #ccc;
  border-radius:15px;
  padding:0 15px;
  font-size:18px;
  outline:none;
}

.search{
  width:65px;
  height:56px;
  border:0;
  border-radius:15px;
  background:#1976d2;
  color:white;
  font-size:25px;
}

.route{
  width:100%;
  height:54px;
  margin-top:10px;
  border:0;
  border-radius:15px;
  background:#222;
  color:white;
  font-size:19px;
}

.location{
  position:absolute;
  z-index:1000;
  right:18px;
  bottom:25px;
  width:60px;
  height:60px;
  border:0;
  border-radius:50%;
  background:white;
  font-size:28px;
  box-shadow:0 4px 15px rgba(0,0,0,.25);
}

#message{
  display:none;
  margin-top:10px;
  padding:12px;
  text-align:center;
  border-radius:14px;
  background:#f5f5f5;
  font-size:16px;
}

#routeInfo{
  display:none;
  position:absolute;
  z-index:1001;
  left:15px;
  right:15px;
  bottom:15px;
  background:white;
  padding:15px;
  border-radius:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.3);
  font-size:17px;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="panel">

  <div class="row">

    <input
      id="searchInput"
      type="text"
      placeholder="സ്ഥലം അല്ലെങ്കിൽ Street തിരയുക">

    <button
      class="search"
      onclick="searchPlace()">
      🔎
    </button>

  </div>

  <button
    class="route"
    onclick="makeRoute()">
    🚗 വഴി കാണിക്കുക
  </button>

  <div id="message"></div>

</div>

<button
  class="location"
  onclick="findLocation()">
  📍
</button>

<div id="routeInfo"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map").setView(
  [24.4539,54.3773],
  11
);

/*
  Clean English map
*/
L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:"© OpenStreetMap"
  }
).addTo(map);


let destination = null;
let myLocation = null;
let destinationMarker = null;
let myMarker = null;
let routeLine = null;


function message(text){

  const box =
    document.getElementById("message");

  box.innerHTML = text;
  box.style.display = "block";
}


/* SEARCH */

async function searchPlace(){

  const input =
    document.getElementById("searchInput");

  const query =
    input.value.trim();

  if(!query){

    message("⚠️ ആദ്യം ഒരു സ്ഥലം എഴുതുക.");
    return;
  }

  message("🔎 സ്ഥലം തിരയുന്നു...");

  try{

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=json" +
      "&limit=5" +
      "&addressdetails=1" +
      "&countrycodes=ae" +
      "&q=" +
      encodeURIComponent(
        query + ", Abu Dhabi, UAE"
      );

    const response =
      await fetch(url);

    const data =
      await response.json();

    if(!data.length){

      message(
        "❌ സ്ഥലം കണ്ടെത്താൻ കഴിഞ്ഞില്ല."
      );

      return;
    }

    const place = data[0];

    const lat =
      parseFloat(place.lat);

    const lon =
      parseFloat(place.lon);

    destination = [lat,lon];

    map.setView(
      [lat,lon],
      17
    );

    if(destinationMarker){

      map.removeLayer(
        destinationMarker
      );
    }

    destinationMarker =
      L.marker([lat,lon])
      .addTo(map);

    destinationMarker
      .bindPopup(
        "📍 " +
        getPlaceName(place)
      )
      .openPopup();

    message(
      "✅ സ്ഥലം കണ്ടെത്തി!"
    );

  }catch(error){

    console.log(error);

    message(
      "❌ Search ചെയ്യാൻ കഴിഞ്ഞില്ല."
    );
  }
}


/* PLACE NAME */

function getPlaceName(place){

  if(
    place.address &&
    place.address.road
  ){

    let name =
      place.address.road;

    if(place.address.city){

      name +=
        ", " +
        place.address.city;
    }

    return name;
  }

  return place.display_name;
}


/* ENTER */

document
.getElementById("searchInput")
.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      searchPlace();
    }

  }
);


/* MY LOCATION */

function findLocation(){

  if(!navigator.geolocation){

    message(
      "❌ Location ലഭ്യമല്ല."
    );

    return;
  }

  message(
    "📍 നിങ്ങളുടെ സ്ഥലം കണ്ടെത്തുന്നു..."
  );

  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;

      myLocation = [lat,lon];

      map.setView(
        [lat,lon],
        17
      );

      if(myMarker){

        map.removeLayer(myMarker);
      }

      myMarker =
        L.marker([lat,lon])
        .addTo(map)
        .bindPopup(
          "📍 നിങ്ങളുടെ സ്ഥലം"
        )
        .openPopup();

      message(
        "✅ നിങ്ങളുടെ സ്ഥലം കണ്ടെത്തി!"
      );

    },

    function(){

      message(
        "❌ Location permission അനുവദിക്കുക."
      );

    },

    {
      enableHighAccuracy:true,
      timeout:15000
    }

  );
}


/* ROUTE */

function makeRoute(){

  if(!destination){

    message(
      "⚠️ ആദ്യം destination Search ചെയ്യുക."
    );

    return;
  }

  if(myLocation){

    calculateRoute();
    return;
  }

  if(!navigator.geolocation){

    message(
      "❌ Location ലഭ്യമല്ല."
    );

    return;
  }

  message(
    "📍 നിങ്ങളുടെ Location എടുക്കുന്നു..."
  );

  navigator.geolocation.getCurrentPosition(

    function(position){

      myLocation = [

        position.coords.latitude,
        position.coords.longitude

      ];

      calculateRoute();

    },

    function(){

      message(
        "❌ Route കാണിക്കാൻ Location permission വേണം."
      );

    },

    {
      enableHighAccuracy:true,
      timeout:15000
    }

  );
}


/* CALCULATE ROUTE */

async function calculateRoute(){

  message(
    "🚗 വഴി കണ്ടെത്തുന്നു..."
  );

  const start =
    myLocation;

  const end =
    destination;

  const url =
    "https://router.project-osrm.org/route/v1/driving/" +

    start[1] + "," + start[0] +

    ";" +

    end[1] + "," + end[0] +

    "?overview=full&geometries=geojson";

  try{

    const response =
      await fetch(url);

    const data =
      await response.json();

    if(
      !data.routes ||
      !data.routes.length
    ){

      message(
        "❌ വഴി കണ്ടെത്താൻ കഴിഞ്ഞില്ല."
      );

      return;
    }

    const route =
      data.routes[0];

    if(routeLine){

      map.removeLayer(
        routeLine
      );
    }

    routeLine =
      L.geoJSON(
        route.geometry,
        {
          style:{
            weight:6
          }
        }
      ).addTo(map);

    map.fitBounds(
      routeLine.getBounds(),
      {
        padding:[40,40]
      }
    );

    const km =
      (route.distance / 1000)
      .toFixed(1);

    const minutes =
      Math.round(
        route.duration / 60
      );

    const info =
      document.getElementById(
        "routeInfo"
      );

    info.innerHTML =
      "🚗 <b>വഴി തയ്യാറായി</b><br><br>" +
      "📏 ദൂരം: " +
      km +
      " km<br>" +
      "⏱️ സമയം: " +
      minutes +
      " മിനിറ്റ്";

    info.style.display =
      "block";

    message(
      "✅ വഴി കണ്ടെത്തി!"
    );

  }catch(error){

    console.log(error);

    message(
      "❌ വഴി ലഭിച്ചില്ല. Internet പരിശോധിക്കുക."
    );
  }
}

</script>

</body>
</html>
