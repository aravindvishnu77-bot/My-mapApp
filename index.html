<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Map App</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .topbar {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      z-index: 1000;
      background: white;
      border-radius: 30px;
      padding: 12px 18px;
      box-shadow: 0 2px 12px #777;
      font-size: 18px;
      font-weight: bold;
    }

    .location-btn {
      position: absolute;
      right: 20px;
      bottom: 30px;
      z-index: 1000;
      width: 58px;
      height: 58px;
      border: none;
      border-radius: 50%;
      background: white;
      font-size: 25px;
      box-shadow: 0 2px 12px #777;
    }
  </style>
</head>

<body>

  <div class="topbar">
    🗺️ My Map App
  </div>

  <button class="location-btn" onclick="myLocation()">
    📍
  </button>

  <div id="map"></div>

  <!-- Leaflet -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <script>

    // Default location
    const defaultLocation = [20.5937, 78.9629];

    // Create map
    const map = L.map("map").setView(defaultLocation, 5);

    // OpenStreetMap
    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "© OpenStreetMap"
      }
    ).addTo(map);

    // Default marker
    let marker = L.marker(defaultLocation)
      .addTo(map)
      .bindPopup("My Map App")
      .openPopup();

    // My Location
    function myLocation() {

      if (!navigator.geolocation) {
        alert("ഈ ഫോണിൽ Location support ഇല്ല.");
        return;
      }

      navigator.geolocation.getCurrentPosition(

        function(position) {

          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          const myPlace = [lat, lng];

          map.setView(myPlace, 17);

          marker.setLatLng(myPlace);

          marker
            .bindPopup("📍 നിങ്ങളുടെ സ്ഥലം")
            .openPopup();
        },

        function() {
          alert("Location permission അനുവദിക്കണം.");
        }

      );
    }

  </script>

</body>
</html>
