<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>എന്റെ മാപ്പ്</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
}

#map {
  width: 100%;
  height: 100vh;
}

/* =========================
   SEARCH PANEL
========================= */

.search-panel {
  position: absolute;
  z-index: 1000;
  top: 15px;
  left: 15px;
  right: 15px;

  background: white;
  padding: 14px;

  border-radius: 25px;

  box-shadow:
    0 5px 20px rgba(0,0,0,0.25);
}

.search-row {
  display: flex;
  gap: 10px;
}

#searchInput {
  flex: 1;

  height: 58px;

  border: 1px solid #ccc;
  border-radius: 17px;

  padding: 0 16px;

  font-size: 18px;

  outline: none;
}

#searchInput:focus {
  border-color: #4285f4;
}

.search-btn {
  width: 78px;
  height: 58px;

  border: none;
  border-radius: 17px;

  background: #4285f4;

  color: white;

  font-size: 28px;

  cursor: pointer;
}

.route-btn {
  width: 100%;

  height: 58px;

  margin-top: 12px;

  border: none;
  border-radius: 17px;

  background: #222;

  color: white;

  font-size: 20px;

  cursor: pointer;
}

.search-btn:active,
.route-btn:active,
.location-btn:active {
  transform: scale(0.97);
}

/* =========================
   MESSAGE
========================= */

#message {
  display: none;

  margin-top: 10px;

  padding: 13px;

  background: white;

  border-radius: 18px;

  text-align: center;

  font-size: 17px;

  box-shadow:
    0 3px 12px rgba(0,0,0,0.18);
}

/* =========================
   LOCATION BUTTON
========================= */

.location-btn {
  position: absolute;

  z-index: 1000;

  right: 18px;
  bottom: 25px;

  width: 62px;
  height: 62px;

  border: none;

  border-radius: 50%;

  background: white;

  box-shadow:
    0 4px 15px rgba(0,0,0,0.25);

  font-size: 30px;

  cursor: pointer;
}

/* =========================
   ROUTE INFO
========================= */

#routeInfo {
  display: none;

  position: absolute;

  z-index: 1001;

  left: 15px;
  right: 15px;

  bottom: 18px;

  background: white;

  border-radius: 20px;

  padding: 16px;

  box-shadow:
    0 4px 18px rgba(0,0,0,0.3);

  font-size: 17px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .search-panel {
    top: 14px;
    left: 14px;
    right: 14px;
    padding: 12px;
  }

  #searchInput {
    font-size: 17px;
  }

  .search-btn {
    width: 72px;
  }

}

</style>
</head>

<body>

<div id="map"></div>


<!-- SEARCH -->

<div class="search-panel">

  <div class="search-row">

    <input
      id="searchInput"
      type="text"
      placeholder="സ്ഥലം അല്ലെങ്കിൽ Street തിരയുക"
    >

    <button
      class="search-btn"
      onclick="searchPlace()">
      🔎
    </button>

  </div>


  <button
    class="route-btn"
    onclick="makeRoute()">

    🚗 Route കാണിക്കുക

  </button>


  <div id="message"></div>

</div>


<!-- LOCATION -->

<button
  class="location-btn"
  onclick="findMyLocation()">

  📍

</button>


<!-- ROUTE INFO -->

<div id="routeInfo"></div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================================================
   MAP
===================================================== */

const map = L.map("map").setView(
  [24.4539, 54.3773],
  11
);


/* =====================================================
   OPENSTREETMAP
   API KEY NOT REQUIRED
===================================================== */

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,

    attribution:
      '&copy; OpenStreetMap contributors'
  }
).addTo(map);


/* =====================================================
   VARIABLES
===================================================== */

let marker = null;

let destination = null;

let userLocation = null;

let routeLine = null;

let userMarker = null;


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text) {

  const box =
    document.getElementById("message");

  box.innerHTML = text;

  box.style.display = "block";

}


/* =====================================================
   SEARCH PLACE
===================================================== */

async function searchPlace() {

  const input =
    document.getElementById("searchInput");

  const query =
    input.value.trim();


  if (query === "") {

    showMessage(
      "⚠️ ആദ്യം ഒരു സ്ഥലം എഴുതുക."
    );

    return;
  }


  showMessage(
    "🔎 സ്ഥലം തിരയുന്നു..."
  );


  try {

    const searches = [

      query + ", Abu Dhabi, UAE",

      query + ", Abu Dhabi",

      query + ", UAE",

      query

    ];


    let found = null;


    for (const q of searches) {

      const url =
        "https://nominatim.openstreetmap.org/search?" +
        "format=json" +
        "&limit=10" +
        "&addressdetails=1" +
        "&countrycodes=ae" +
        "&q=" +
        encodeURIComponent(q);


      const response =
        await fetch(url, {

          headers: {
            "Accept":
              "application/json"
          }

        });


      if (!response.ok) {

        continue;

      }


      const data =
        await response.json();


      if (data.length > 0) {

        found =
          data.find(item => {

            const text =
              (
                item.display_name +
                " " +
                (item.address?.city || "") +
                " " +
                (item.address?.state || "")
              ).toLowerCase();


            return (

              text.includes("abu dhabi") ||

              text.includes("أبو ظبي") ||

              text.includes("bani yas") ||

              text.includes("بني ياس")

            );

          }) || data[0];


        if (found) {

          break;

        }

      }

    }


    /* NOT FOUND */

    if (!found) {

      showMessage(
        "❌ ഈ സ്ഥലം കണ്ടെത്താൻ കഴിഞ്ഞില്ല."
      );

      return;

    }


    const lat =
      parseFloat(found.lat);

    const lon =
      parseFloat(found.lon);


    destination = [
      lat,
      lon
    ];


    /* MOVE MAP */

    map.setView(
      [lat, lon],
      17
    );


    /* REMOVE OLD MARKER */

    if (marker) {

      map.removeLayer(marker);

    }


    /* NEW MARKER */

    marker =
      L.marker(
        [lat, lon]
      )
      .addTo(map);


    /* POPUP */

    marker
      .bindPopup(
        "📍 " +
        cleanPlaceName(found)
      )
      .openPopup();


    showMessage(
      "✅ സ്ഥലം കണ്ടെത്തി!"
    );

  }

  catch (error) {

    console.log(error);

    showMessage(
      "❌ Search ചെയ്യാൻ കഴിഞ്ഞില്ല."
    );

  }

}


/* =====================================================
   PLACE NAME
===================================================== */

function cleanPlaceName(place) {

  if (
    place.address &&
    place.address.road
  ) {

    let name =
      place.address.road;


    if (place.address.city) {

      name +=
        ", " +
        place.address.city;

    }


    return name;

  }


  return place.display_name;

}


/* =====================================================
   ENTER KEY
===================================================== */

document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        searchPlace();

      }

    }
  );


/* =====================================================
   MY LOCATION
===================================================== */

function findMyLocation() {

  if (!navigator.geolocation) {

    showMessage(
      "❌ നിങ്ങളുടെ ഫോണിൽ Location support ഇല്ല."
    );

    return;

  }


  showMessage(
    "📍 നിങ്ങളുടെ സ്ഥലം കണ്ടെത്തുന്നു..."
  );


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;


      userLocation = [
        lat,
        lon
      ];


      map.setView(
        [lat, lon],
        17
      );


      /* REMOVE OLD USER MARKER */

      if (userMarker) {

        map.removeLayer(
          userMarker
        );

      }


      /* USER MARKER */

      userMarker =
        L.marker(
          [lat, lon]
        )
        .addTo(map);


      userMarker
        .bindPopup(
          "📍 നിങ്ങളുടെ ഇപ്പോഴത്തെ സ്ഥലം"
        )
        .openPopup();


      showMessage(
        "✅ നിങ്ങളുടെ Location കണ്ടെത്തി!"
      );

    },


    function(error) {

      console.log(error);


      showMessage(
        "❌ Location permission അനുവദിക്കുക."
      );

    },


    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );

}


/* =====================================================
   ROUTE
===================================================== */

function makeRoute() {

  if (!destination) {

    showMessage(
      "⚠️ ആദ്യം ഒരു സ്ഥലം Search ചെയ്യുക."
    );

    return;

  }


  if (!navigator.geolocation) {

    showMessage(
      "❌ Location ലഭ്യമല്ല."
    );

    return;

  }


  /* Already have location */

  if (userLocation) {

    calculateRoute();

    return;

  }


  showMessage(
    "📍 നിങ്ങളുടെ Location എടുക്കുന്നു..."
  );


  navigator.geolocation.getCurrentPosition(

    function(position) {

      userLocation = [

        position.coords.latitude,

        position.coords.longitude

      ];


      calculateRoute();

    },


    function() {

      showMessage(
        "❌ Route കാണിക്കാൻ Location permission വേണം."
      );

    },


    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );

}


/* =====================================================
   CALCULATE ROUTE
===================================================== */

async function calculateRoute() {

  showMessage(
    "🚗 Route കണ്ടെത്തുന്നു..."
  );


  const start =
    userLocation;

  const end =
    destination;


  const url =
    "https://router.project-osrm.org/route/v1/driving/" +

    start[1] +
    "," +
    start[0] +

    ";" +

    end[1] +
    "," +
    end[0] +

    "?overview=full&geometries=geojson";


  try {

    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Route server error"
      );

    }


    const data =
      await response.json();


    if (
      !data.routes ||
      data.routes.length === 0
    ) {

      showMessage(
        "❌ Route കണ്ടെത്താൻ കഴിഞ്ഞില്ല."
      );

      return;

    }


    const route =
      data.routes[0];


    /* REMOVE OLD ROUTE */

    if (routeLine) {

      map.removeLayer(
        routeLine
      );

    }


    /* DRAW ROUTE */

    routeLine =
      L.geoJSON(
        route.geometry,
        {
          style: {
            weight: 6
          }
        }
      )
      .addTo(map);


    /* FIT MAP */

    map.fitBounds(
      routeLine.getBounds(),
      {
        padding: [50, 50]
      }
    );


    /* DISTANCE */

    const distanceKm =
      (
        route.distance / 1000
      ).toFixed(1);


    /* TIME */

    const minutes =
      Math.round(
        route.duration / 60
      );


    /* ROUTE INFO */

    const info =
      document.getElementById(
        "routeInfo"
      );


    info.innerHTML =

      "🚗 <b>Route തയ്യാറായി</b><br><br>" +

      "📏 ദൂരം: " +
      distanceKm +
      " km<br>" +

      "⏱️ ഏകദേശം സമയം: " +
      minutes +
      " മിനിറ്റ്";


    info.style.display =
      "block";


    showMessage(
      "✅ Route കണ്ടെത്തി!"
    );

  }

  catch (error) {

    console.log(error);


    showMessage(
      "❌ Route ലഭിച്ചില്ല. Internet പരിശോധിക്കുക."
    );

  }

}

</script>

</body>
</html>
