<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>എന്റെ മാപ്പ്</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* TOP PANEL */
    .panel {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 30px);
      max-width: 650px;
      z-index: 1000;

      background: rgba(255,255,255,0.97);
      padding: 14px;
      border-radius: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }

    .title {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    #searchInput {
      flex: 1;
      height: 54px;
      border: 1px solid #ccc;
      border-radius: 16px;
      padding: 0 16px;
      font-size: 17px;
      outline: none;
    }

    #searchInput:focus {
      border-color: #4285f4;
    }

    .search-btn {
      width: 60px;
      height: 54px;
      border: none;
      border-radius: 16px;
      background: #4285f4;
      color: white;
      font-size: 25px;
    }

    .route-btn {
      width: 100%;
      height: 54px;
      margin-top: 10px;
      border: none;
      border-radius: 16px;
      background: #222;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    .location-btn {
      position: absolute;
      right: 18px;
      bottom: 25px;
      z-index: 1000;

      width: 62px;
      height: 62px;
      border: none;
      border-radius: 50%;
      background: white;
      font-size: 28px;

      box-shadow: 0 3px 15px rgba(0,0,0,0.25);
    }

    .message {
      display: none;
      margin-top: 10px;
      background: white;
      padding: 14px;
      border-radius: 18px;
      text-align: center;
      font-size: 17px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.2);
    }

    .leaflet-popup-content {
      font-size: 16px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="panel">

    <div class="title">
      🗺️ എന്റെ മാപ്പ്
    </div>

    <div class="search-row">

      <input
        id="searchInput"
        type="text"
        placeholder="സ്ഥലം അല്ലെങ്കിൽ Street തിരയുക"
      >

      <button
        class="search-btn"
        onclick="searchPlace()">
        🔎
      </button>

    </div>

    <button
      class="route-btn"
      onclick="makeRoute()">
      🚗 Route
    </button>

    <div id="message" class="message"></div>

  </div>

  <button
    class="location-btn"
    onclick="myLocation()">
    📍
  </button>

  <div id="map"></div>


  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>


  <script>

    let map;
    let marker = null;
    let destination = null;
    let routeControl = null;


    /* MAP */

    map = L.map("map").setView(
      [24.4539, 54.3773],
      12
    );


    /*
      English-style map.
      Arabic labels ഒഴിവാക്കാൻ
      Esri World Street Map ഉപയോഗിക്കുന്നു.
    */

    L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom: 19,
        attribution:
          "© Esri"
      }
    ).addTo(map);


    /* DEFAULT MARKER */

    marker = L.marker(
      [24.4539, 54.3773]
    ).addTo(map);

    marker.bindPopup(
      "📍 അബുദാബി"
    );


    /* MESSAGE */

    function showMessage(text) {

      const box =
        document.getElementById("message");

      box.innerHTML = text;

      box.style.display = "block";
    }


    /* SEARCH */

    async function searchPlace() {

      const input =
        document.getElementById("searchInput");

      let query =
        input.value.trim();


      if (query === "") {

        showMessage(
          "⚠️ ആദ്യം ഒരു സ്ഥലം എഴുതുക."
        );

        return;
      }


      showMessage(
        "🔎 സ്ഥലം തിരയുന്നു..."
      );


      try {

        let searches = [

          query + ", Abu Dhabi, UAE",

          query + ", UAE",

          query

        ];


        let found = null;


        for (let q of searches) {

          const url =
            "https://nominatim.openstreetmap.org/search?" +
            "format=json" +
            "&limit=10" +
            "&addressdetails=1" +
            "&namedetails=1" +
            "&q=" +
            encodeURIComponent(q);


          const response =
            await fetch(url, {
              headers: {
                "Accept":
                  "application/json"
              }
            });


          const data =
            await response.json();


          if (data.length > 0) {

            found =
              data.find(item => {

                const name =
                  (
                    item.display_name ||
                    ""
                  ).toLowerCase();

                return (
                  name.includes("abu dhabi") ||
                  name.includes("uae") ||
                  name.includes("united arab emirates")
                );

              }) || data[0];


            if (found) {
              break;
            }
          }
        }


        if (!found) {

          showMessage(
            "❌ ഈ സ്ഥലം കണ്ടെത്താൻ കഴിഞ്ഞില്ല."
          );

          return;
        }


        const lat =
          parseFloat(found.lat);

        const lon =
          parseFloat(found.lon);


        destination =
          [lat, lon];


        map.setView(
          [lat, lon],
          17
        );


        if (marker) {

          map.removeLayer(marker);

        }


        marker =
          L.marker(
            [lat, lon]
          ).addTo(map);


        /*
          English name കിട്ടിയാൽ
          അത് ഉപയോഗിക്കും.
        */

        let placeName =
          found.namedetails &&
          (
            found.namedetails["name:en"] ||
            found.namedetails["name"]
          );


        if (!placeName) {

          placeName =
            found.display_name;

        }


        marker
          .bindPopup(
            "📍 " + placeName
          )
          .openPopup();


        showMessage(
          "✅ സ്ഥലം കണ്ടെത്തി!"
        );

      }

      catch (error) {

        console.log(error);

        showMessage(
          "❌ Search ചെയ്യാൻ കഴിഞ്ഞില്ല. Internet പരിശോധിക്കുക."
        );

      }

    }


    /* CURRENT LOCATION */

    function myLocation() {

      if (!navigator.geolocation) {

        showMessage(
          "❌ ഈ ഫോണിൽ Location support ഇല്ല."
        );

        return;
      }


      showMessage(
        "📍 നിങ്ങളുടെ സ്ഥലം കണ്ടെത്തുന്നു..."
      );


      navigator.geolocation.getCurrentPosition(

        function(position) {

          const lat =
            position.coords.latitude;

          const lon =
            position.coords.longitude;


          const location =
            [lat, lon];


          map.setView(
            location,
            17
          );


          if (marker) {

            map.removeLayer(marker);

          }


          marker =
            L.marker(location)
              .addTo(map)
              .bindPopup(
                "📍 നിങ്ങളുടെ സ്ഥലം"
              )
              .openPopup();


          showMessage(
            "✅ നിങ്ങളുടെ സ്ഥലം കണ്ടെത്തി!"
          );

        },


        function() {

          showMessage(
            "❌ Location permission അനുവദിക്കണം."
          );

        },

        {
          enableHighAccuracy: true,
          timeout: 10000
        }

      );

    }


    /* ROUTE */

    function makeRoute() {

      if (!destination) {

        showMessage(
          "⚠️ ആദ്യം ഒരു സ്ഥലം Search ചെയ്യുക."
        );

        return;
      }


      if (!navigator.geolocation) {

        showMessage(
          "❌ Location support ഇല്ല."
        );

        return;
      }


      navigator.geolocation.getCurrentPosition(

        function(position) {

          const start =
            L.latLng(
              position.coords.latitude,
              position.coords.longitude
            );


          const end =
            L.latLng(
              destination[0],
              destination[1]
            );


          if (routeControl) {

            map.removeControl(
              routeControl
            );

          }


          routeControl =
            L.Routing.control({

              waypoints: [
                start,
                end
              ],

              routeWhileDragging:
                false,

              addWaypoints:
                false,

              showAlternatives:
                false,

              language:
                "en",

              createMarker:
                function() {
                  return null;
                }

            }).addTo(map);


          showMessage(
            "🚗 Route തയ്യാറാക്കുന്നു..."
          );

        },


        function() {

          showMessage(
            "❌ Route കാണാൻ Location permission വേണം."
          );

        }

      );

    }


    /* ENTER BUTTON */

    document
      .getElementById("searchInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            searchPlace();

          }

        }
      );

  </script>

</body>
</html>
