<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Map App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .title {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: white;
      padding: 10px 18px;
      border-radius: 25px;
      box-shadow: 0 2px 10px #777;
      font-size: 18px;
      font-weight: bold;
    }

    .location-btn {
      position: absolute;
      bottom: 30px;
      right: 20px;
      z-index: 10;
      border: none;
      background: white;
      padding: 15px;
      border-radius: 50%;
      font-size: 22px;
      box-shadow: 0 2px 10px #777;
    }
  </style>
</head>

<body>

  <div class="title">🗺️ My Map App</div>

  <button class="location-btn" onclick="myLocation()">
    📍
  </button>

  <div id="map"></div>

  <script>
    let map;
    let marker;

    function initMap() {

      const defaultLocation = {
        lat: 20.5937,
        lng: 78.9629
      };

      map = new google.maps.Map(document.getElementById("map"), {
        center: defaultLocation,
        zoom: 5,
        mapTypeControl: true,
        streetViewControl: true,
        fullscreenControl: true
      });

      marker = new google.maps.Marker({
        position: defaultLocation,
        map: map,
        title: "My Map App"
      });
    }

    function myLocation() {

      if (!navigator.geolocation) {
        alert("നിന്റെ ഫോണിൽ Location support ഇല്ല.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(position) {

          const location = {
            lat: position.coords.latitude,
            lng: position.coords.longitude
          };

          map.setCenter(location);
          map.setZoom(17);

          marker.setPosition(location);
          marker.setTitle("നിങ്ങളുടെ സ്ഥലം");

        },
        function() {
          alert("Location permission അനുവദിക്കണം.");
        }
      );
    }
  </script>

  <!-- Google Maps -->
  <script
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&callback=initMap"
    async
    defer>
  </script>

</body>
</html>
