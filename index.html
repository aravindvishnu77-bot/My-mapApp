<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>എന്റെ മാപ്പ്</title>

  <!-- Leaflet -->
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- Geocoder -->
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .top-box {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: 92%;
      max-width: 500px;
    }

    .title {
      background: white;
      padding: 12px 18px;
      border-radius: 25px;
      text-align: center;
      font-size: 19px;
      font-weight: bold;
      box-shadow: 0 2px 10px #777;
      margin-bottom: 8px;
    }

    .search-box {
      display: flex;
      background: white;
      border-radius: 25px;
      padding: 5px;
      box-shadow: 0 2px 10px #777;
    }

    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      padding: 10px 15px;
      font-size: 16px;
      border-radius: 25px;
    }

    .search-box button {
      border: none;
      background: #4285f4;
      color: white;
      border-radius: 22px;
      padding: 0 18px;
      font-size: 15px;
    }

    .location-btn {
      position: absolute;
      bottom: 80px;
      right: 20px;
      z-index: 1000;
      width: 55px;
      height: 55px;
      border: none;
      border-radius: 50%;
      background: white;
      font-size: 25px;
      box-shadow: 0 2px 10px #777;
    }

    .route-btn {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      border: none;
      border-radius: 25px;
      background: #4285f4;
      color: white;
      padding: 12px 25px;
      font-size: 16px;
      box-shadow: 0 2px 10px #777;
    }
  </style>
</head>

<body>

  <div class="top-box">

    <div class="title">
      🗺️ എന്റെ മാപ്പ്
    </div>

    <div class="search-box">
      <input
        id="searchInput"
        type="text"
        placeholder="സ്ഥലം തിരയുക..."
      >

      <button onclick="searchPlace()">
        തിരയുക
      </button>
    </div>

  </div>

  <button class="location-btn"
          onclick="myLocation()">
    📍
  </button>

  <button class="route-btn"
          onclick="makeRoute()">
    🛣️ വഴി കാണിക്കുക
  </button>

  <div id="map"></div>


  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Geocoder -->
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <script>

    // മാപ്പ്
    let map = L.map('map').setView(
      [20.5937, 78.9629],
      5
    );

    // OpenStreetMap
    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }
    ).addTo(map);


    let myMarker = null;
    let destinationMarker = null;
    let routeLine = null;


    // എന്റെ സ്ഥലം
    function myLocation() {

      if (!navigator.geolocation) {
        alert("നിങ്ങളുടെ ഫോണിൽ Location ലഭ്യമല്ല.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(position) {

          let lat = position.coords.latitude;
          let lng = position.coords.longitude;

          let location = [lat, lng];

          map.setView(location, 17);

          if (myMarker) {
            myMarker.setLatLng(location);
          } else {
            myMarker = L.marker(location)
              .addTo(map)
              .bindPopup("📍 നിങ്ങളുടെ സ്ഥലം")
              .openPopup();
          }

        },

        function() {
          alert("Location Permission അനുവദിക്കുക.");
        }
      );
    }


    // സ്ഥലം തിരയുക
    async function searchPlace() {

      let place =
        document.getElementById("searchInput").value.trim();

      if (place === "") {
        alert("ഒരു സ്ഥലം എഴുതുക.");
        return;
      }

      try {

        let url =
          "https://nominatim.openstreetmap.org/search?format=json&q="
          + encodeURIComponent(place);

        let response = await fetch(url);

        let data = await response.json();

        if (data.length === 0) {
          alert("സ്ഥലം കണ്ടെത്താനായില്ല.");
          return;
        }

        let lat = parseFloat(data[0].lat);
        let lon = parseFloat(data[0].lon);

        map.setView([lat, lon], 15);

        if (destinationMarker) {
          destinationMarker.setLatLng([lat, lon]);
        } else {
          destinationMarker =
            L.marker([lat, lon]).addTo(map);
        }

        destinationMarker
          .bindPopup("📍 " + data[0].display_name)
          .openPopup();

      } catch (error) {

        alert("Search ചെയ്യാൻ കഴിഞ്ഞില്ല.");

      }
    }


    // വഴി കാണിക്കുക
    function makeRoute() {

      if (!myMarker || !destinationMarker) {

        alert(
          "ആദ്യം 📍 നിങ്ങളുടെ സ്ഥലം കണ്ടെത്തുക, ശേഷം ഒരു സ്ഥലം തിരയുക."
        );

        return;
      }

      let start = myMarker.getLatLng();
      let end = destinationMarker.getLatLng();

      let url =
        "https://router.project-osrm.org/route/v1/driving/"
        + start.lng + "," + start.lat
        + ";"
        + end.lng + "," + end.lat
        + "?overview=full&geometries=geojson";

      fetch(url)
        .then(response => response.json())
        .then(data => {

          if (!data.routes || data.routes.length === 0) {

            alert("വഴി കണ്ടെത്താനായില്ല.");
            return;

          }

          let coordinates =
            data.routes[0].geometry.coordinates;

          let latlngs =
            coordinates.map(
              point => [point[1], point[0]]
            );

          if (routeLine) {
            map.removeLayer(routeLine);
          }

          routeLine =
            L.polyline(latlngs, {
              weight: 6
            }).addTo(map);

          map.fitBounds(routeLine.getBounds());

          let distance =
            (data.routes[0].distance / 1000).toFixed(1);

          let time =
            Math.round(
              data.routes[0].duration / 60
            );

          alert(
            "ദൂരം: " + distance +
            " km\nസമയം: ഏകദേശം " +
            time + " മിനിറ്റ്"
          );

        })
        .catch(() => {

          alert("Route ലഭ്യമാക്കാൻ കഴിഞ്ഞില്ല.");

        });
    }


    // Enter അമർത്തിയാൽ Search
    document
      .getElementById("searchInput")
      .addEventListener("keypress", function(event) {

        if (event.key === "Enter") {
          searchPlace();
        }

      });

  </script>

</body>
</html>
