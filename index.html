<!DOCTYPE html>
<html lang="ml">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>എന്റെ മാപ്പ്</title>

<link
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
rel="stylesheet">


<style>

/* =========================
   BASIC
========================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:
        Arial,
        "Noto Sans Malayalam",
        sans-serif;
}

body{
    overflow:hidden;
    background:#eaf4ff;
}


/* =========================
   MAP
========================= */

#map{
    width:100%;
    height:100vh;
}


/* =========================
   TOP PANEL
========================= */

.search-panel{

    position:absolute;

    z-index:1000;

    top:14px;
    left:12px;
    right:12px;

    background:rgba(255,255,255,0.97);

    padding:12px;

    border-radius:26px;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.22);

}


/* =========================
   SEARCH ROW
========================= */

.search-row{

    display:flex;

    gap:9px;

    align-items:center;

}


#searchInput{

    flex:1;

    height:58px;

    border:2px solid #e1e5eb;

    border-radius:18px;

    padding:
        0 16px;

    font-size:18px;

    color:#222;

    background:#fff;

    outline:none;

}


#searchInput:focus{

    border-color:#4285f4;

}


#searchInput::placeholder{

    color:#8a8a8a;

}


/* =========================
   SEARCH BUTTON
========================= */

.search-btn{

    width:64px;

    height:58px;

    border:none;

    border-radius:18px;

    background:#4285f4;

    color:white;

    font-size:27px;

    cursor:pointer;

    box-shadow:
        0 4px 10px rgba(66,133,244,0.35);

}


.search-btn:active{

    transform:scale(.95);

}


/* =========================
   ROUTE BUTTON
========================= */

.route-btn{

    width:100%;

    height:58px;

    margin-top:11px;

    border:none;

    border-radius:18px;

    background:#202124;

    color:white;

    font-size:20px;

    font-weight:bold;

    cursor:pointer;

}


.route-btn:active{

    transform:scale(.98);

}


/* =========================
   MESSAGE
========================= */

#message{

    display:none;

    margin-top:10px;

    padding:12px;

    background:#f7f7f7;

    border-radius:17px;

    text-align:center;

    font-size:17px;

    color:#222;

}


/* =========================
   LOCATION BUTTON
========================= */

.location-btn{

    position:absolute;

    z-index:1000;

    right:17px;

    bottom:25px;

    width:62px;

    height:62px;

    border:none;

    border-radius:50%;

    background:white;

    font-size:28px;

    cursor:pointer;

    box-shadow:
        0 5px 18px rgba(0,0,0,.25);

}


.location-btn:active{

    transform:scale(.94);

}


/* =========================
   ROUTE INFO
========================= */

#routeInfo{

    display:none;

    position:absolute;

    z-index:1001;

    left:12px;

    right:12px;

    bottom:16px;

    background:white;

    border-radius:20px;

    padding:17px;

    box-shadow:
        0 5px 22px rgba(0,0,0,.28);

    font-size:17px;

    line-height:1.6;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .search-panel{

        top:12px;

        left:10px;

        right:10px;

        padding:11px;

        border-radius:24px;

    }

    #searchInput{

        height:56px;

        font-size:17px;

    }

    .search-btn{

        width:62px;

        height:56px;

    }

    .route-btn{

        height:56px;

        font-size:19px;

    }

}


/* =========================
   LEAFLET POPUP
========================= */

.leaflet-popup-content{

    font-size:16px;

    font-family:
        Arial,
        "Noto Sans Malayalam",
        sans-serif;

}


/* =========================
   LEAFLET CONTROL
========================= */

.leaflet-control-zoom{

    border-radius:12px !important;

    overflow:hidden;

}

</style>

</head>


<body>


<!-- =========================
     MAP
========================= -->

<div id="map"></div>


<!-- =========================
     SEARCH PANEL
========================= -->

<div class="search-panel">


    <div class="search-row">


        <input
            id="searchInput"
            type="text"
            placeholder="സ്ഥലം അല്ലെങ്കിൽ റോഡ് തിരയുക"
            autocomplete="off"
        >


        <button
            class="search-btn"
            onclick="searchPlace()">

            🔎

        </button>


    </div>


    <button
        class="route-btn"
        onclick="makeRoute()">

        🚗 വഴി കാണിക്കുക

    </button>


    <div id="message"></div>


</div>


<!-- =========================
     MY LOCATION
========================= -->

<button
    class="location-btn"
    onclick="findMyLocation()">

    📍

</button>


<!-- =========================
     ROUTE INFORMATION
========================= -->

<div id="routeInfo"></div>


<!-- =========================
     LEAFLET
========================= -->

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>


/* =====================================================
   മാപ്പ് ആരംഭിക്കുക
===================================================== */

const map = L.map("map").setView(

    [24.4539, 54.3773],

    11

);


/* =====================================================
   OPEN STREET MAP
===================================================== */

L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        maxZoom:19,

        attribution:
        "&copy; OpenStreetMap contributors"

    }

).addTo(map);


/* =====================================================
   VARIABLES
===================================================== */

let marker = null;

let destination = null;

let userLocation = null;

let routeLine = null;

let userMarker = null;


/* =====================================================
   MESSAGE കാണിക്കുക
===================================================== */

function showMessage(text){

    const box =
        document.getElementById("message");

    box.innerHTML = text;

    box.style.display = "block";

}


/* =====================================================
   SEARCH
===================================================== */

async function searchPlace(){


    const input =
        document.getElementById("searchInput");


    const query =
        input.value.trim();


    if(query === ""){

        showMessage(
            "⚠️ ആദ്യം ഒരു സ്ഥലം എഴുതുക."
        );

        return;

    }


    showMessage(
        "🔎 സ്ഥലം തിരയുന്നു..."
    );


    try{


        const searches = [

            query + ", Abu Dhabi, UAE",

            query + ", Abu Dhabi",

            query + ", UAE",

            query

        ];


        let found = null;


        for(const q of searches){


            const url =

                "https://nominatim.openstreetmap.org/search?" +

                "format=json" +

                "&limit=10" +

                "&addressdetails=1" +

                "&countrycodes=ae" +

                "&q=" +

                encodeURIComponent(q);


            const response =
                await fetch(url);


            if(!response.ok){

                continue;

            }


            const data =
                await response.json();


            if(data.length > 0){


                found = data.find(item => {


                    const text = (

                        item.display_name +

                        " " +

                        (item.address?.city || "") +

                        " " +

                        (item.address?.state || "")

                    ).toLowerCase();


                    return (

                        text.includes("abu dhabi") ||

                        text.includes("bani yas") ||

                        text.includes("أبو ظبي") ||

                        text.includes("بني ياس")

                    );


                }) || data[0];


                if(found){

                    break;

                }

            }

        }


        /* =========================
           സ്ഥലം കിട്ടിയില്ല
        ========================= */

        if(!found){

            showMessage(
                "❌ ഈ സ്ഥലം കണ്ടെത്താൻ കഴിഞ്ഞില്ല."
            );

            return;

        }


        const lat =
            parseFloat(found.lat);


        const lon =
            parseFloat(found.lon);


        destination = [

            lat,
            lon

        ];


        /* =========================
           മാപ്പിലേക്ക് പോകുക
        ========================= */

        map.setView(

            [lat, lon],

            17

        );


        /* =========================
           പഴയ മാർക്കർ നീക്കം
        ========================= */

        if(marker){

            map.removeLayer(marker);

        }


        /* =========================
           പുതിയ മാർക്കർ
        ========================= */

        marker = L.marker(

            [lat, lon]

        ).addTo(map);


        marker.bindPopup(

            "📍 " +
            cleanPlaceName(found)

        ).openPopup();


        showMessage(

            "✅ സ്ഥലം കണ്ടെത്തി."

        );


    }

    catch(error){

        console.log(error);

        showMessage(

            "❌ സ്ഥലം തിരയാൻ കഴിഞ്ഞില്ല."

        );

    }

}


/* =====================================================
   സ്ഥലത്തിന്റെ പേര്
===================================================== */

function cleanPlaceName(place){


    if(

        place.address &&

        place.address.road

    ){

        let name =
            place.address.road;


        if(place.address.city){

            name +=
                ", " +
                place.address.city;

        }


        return name;

    }


    return place.display_name;

}


/* =====================================================
   ENTER അമർത്തുമ്പോൾ SEARCH
===================================================== */

document

    .getElementById("searchInput")

    .addEventListener(

        "keydown",

        function(event){

            if(event.key === "Enter"){

                searchPlace();

            }

        }

    );


/* =====================================================
   എന്റെ സ്ഥലം കണ്ടെത്തുക
===================================================== */

function findMyLocation(){


    if(!navigator.geolocation){

        showMessage(

            "❌ നിങ്ങളുടെ ഫോണിൽ Location ലഭ്യമല്ല."

        );

        return;

    }


    showMessage(

        "📍 നിങ്ങളുടെ സ്ഥലം കണ്ടെത്തുന്നു..."

    );


    navigator.geolocation.getCurrentPosition(


        function(position){


            const lat =
                position.coords.latitude;


            const lon =
                position.coords.longitude;


            userLocation = [

                lat,
                lon

            ];


            map.setView(

                [lat, lon],

                17

            );


            /* പഴയ മാർക്കർ നീക്കം */

            if(userMarker){

                map.removeLayer(
                    userMarker
                );

            }


            /* പുതിയ Location മാർക്കർ */

            userMarker = L.marker(

                [lat, lon]

            ).addTo(map);


            userMarker.bindPopup(

                "📍 നിങ്ങൾ ഇപ്പോൾ ഇവിടെ ആണ്"

            ).openPopup();


            showMessage(

                "✅ നിങ്ങളുടെ സ്ഥലം കണ്ടെത്തി."

            );


        },


        function(error){

            console.log(error);


            showMessage(

                "❌ Location അനുമതി അനുവദിക്കുക."

            );

        },


        {

            enableHighAccuracy:true,

            timeout:15000,

            maximumAge:0

        }

    );

}


/* =====================================================
   വഴി കാണിക്കുക
===================================================== */

function makeRoute(){


    if(!destination){

        showMessage(

            "⚠️ ആദ്യം ഒരു സ്ഥലം തിരയുക."

        );

        return;

    }


    if(!navigator.geolocation){

        showMessage(

            "❌ നിങ്ങളുടെ Location ലഭ്യമല്ല."

        );

        return;

    }


    /* Location നേരത്തെ കിട്ടിയിട്ടുണ്ടെങ്കിൽ */

    if(userLocation){

        calculateRoute();

        return;

    }


    showMessage(

        "📍 നിങ്ങളുടെ സ്ഥലം കണ്ടെത്തുന്നു..."

    );


    navigator.geolocation.getCurrentPosition(


        function(position){


            userLocation = [

                position.coords.latitude,

                position.coords.longitude

            ];


            calculateRoute();

        },


        function(){

            showMessage(

                "❌ വഴി കാണിക്കാൻ Location അനുമതി വേണം."

            );

        },


        {

            enableHighAccuracy:true,

            timeout:15000,

            maximumAge:0

        }

    );

}


/* =====================================================
   ROUTE CALCULATE
===================================================== */

async function calculateRoute(){


    showMessage(

        "🚗 വഴി കണ്ടെത്തുന്നു..."

    );


    const start =
        userLocation;


    const end =
        destination;


    const url =

        "https://router.project-osrm.org/route/v1/driving/" +

        start[1] +
        "," +
        start[0] +

        ";" +

        end[1] +
        "," +
        end[0] +

        "?overview=full&geometries=geojson";


    try{


        const response =
            await fetch(url);


        if(!response.ok){

            throw new Error(
                "Route server error"
            );

        }


        const data =
            await response.json();


        if(

            !data.routes ||

            data.routes.length === 0

        ){

            showMessage(

                "❌ വഴി കണ്ടെത്താൻ കഴിഞ്ഞില്ല."

            );

            return;

        }


        const route =
            data.routes[0];


        /* =========================
           പഴയ വഴി നീക്കം
        ========================= */

        if(routeLine){

            map.removeLayer(
                routeLine
            );

        }


        /* =========================
           പുതിയ വഴി വരയ്ക്കുക
        ========================= */

        routeLine = L.geoJSON(

            route.geometry,

            {

                style:{

                    weight:6

                }

            }

        ).addTo(map);


        /* =========================
           മുഴുവൻ വഴി കാണിക്കുക
        ========================= */

        map.fitBounds(

            routeLine.getBounds(),

            {

                padding:[
                    60,
                    60
                ]

            }

        );


        /* =========================
           ദൂരം
        ========================= */

        const distanceKm = (

            route.distance / 1000

        ).toFixed(1);


        /* =========================
           സമയം
        ========================= */

        const minutes = Math.round(

            route.duration / 60

        );


        /* =========================
           Route Information
        ========================= */

        const info =
            document.getElementById(
                "routeInfo"
            );


        info.innerHTML =

            "🚗 <b>വഴി തയ്യാറായി</b><br><br>" +

            "📍 ദൂരം: " +

            distanceKm +

            " കിലോമീറ്റർ<br>" +

            "⏱️ ഏകദേശം സമയം: " +

            minutes +

            " മിനിറ്റ്";


        info.style.display =
            "block";


        showMessage(

            "✅ വഴി കണ്ടെത്തി."

        );


    }

    catch(error){

        console.log(error);


        showMessage(

            "❌ വഴി ലഭിച്ചില്ല. Internet പരിശോധിക്കുക."

        );

    }

}


</script>

</body>

</html>
