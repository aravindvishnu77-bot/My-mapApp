<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>എന്റെ മാപ്പ്</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<link rel="stylesheet"
href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css">

<style>

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
}

#map {
  width: 100%;
  height: 100%;
}

/* Search box */

.search-box {
  position: absolute;
  top: 15px;
  left: 15px;
  right: 15px;
  z-index: 1000;
  background: white;
  padding: 12px;
  border-radius: 20px;
  box-shadow: 0 3px 15px #777;
}

.search-row {
  display: flex;
  gap: 8px;
}

#searchInput {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 14px;
  font-size: 16px;
  outline: none;
}

.search-btn {
  width: 70px;
  border: none;
  border-radius: 14px;
  background: #4285f4;
  color: white;
  font-size: 25px;
}

.route-btn {
  width: 100%;
  margin-top: 10px;
  padding: 13px;
  border: none;
  border-radius: 14px;
  background: #222;
  color: white;
  font-size: 17px;
}

/* Message */

.message {
  position: absolute;
  top: 125px;
  left: 20px;
  right: 20px;
  z-index: 1000;
  background: white;
  padding: 13px;
  border-radius: 15px;
  box-shadow: 0 3px 12px #777;
  text-align: center;
  font-size: 16px;
  display: none;
}

/* Location button */

.location-btn {
  position: absolute;
  bottom: 30px;
  right: 20px;
  z-index: 1000;
  width: 58px;
  height: 58px;
  border: none;
  border-radius: 50%;
  background: white;
  box-shadow: 0 3px 12px #777;
  font-size: 25px;
}

</style>
</head>

<body>

<!-- Search -->

<div class="search-box">

  <div class="search-row">

    <input
      id="searchInput"
      type="text"
      placeholder="സ്ഥലം അല്ലെങ്കിൽ Street തിരയുക..."
    >

    <button
      class="search-btn"
      onclick="searchPlace()">
      🔎
    </button>

  </div>

  <button
    class="route-btn"
    onclick="makeRoute()">
    🚗 Route
  </button>

</div>


<!-- Message -->

<div id="message" class="message"></div>


<!-- Current location -->

<button
  class="location-btn"
  onclick="myLocation()">
  📍
</button>


<!-- Map -->

<div id="map"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js">
</script>


<script>

/* =========================
   VARIABLES
========================= */

let map;
let marker = null;
let currentLocation = null;
let destination = null;
let routeControl = null;


/* =========================
   DEFAULT MAP
========================= */

const defaultLocation = [
  24.4539,
  54.3773
];


map = L.map("map").setView(
  defaultLocation,
  12
);


/* =========================
   OPEN STREET MAP
========================= */

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution:
      "&copy; OpenStreetMap contributors"
  }
).addTo(map);


/* =========================
   DEFAULT MARKER
========================= */

marker = L.marker(defaultLocation)
  .addTo(map)
  .bindPopup("📍 അബുദാബി");


/* =========================
   MESSAGE
========================= */

function showMessage(text) {

  const box =
    document.getElementById("message");

  box.innerText = text;

  box.style.display = "block";

  setTimeout(function() {

    box.style.display = "none";

  }, 3500);
}


/* =========================
   SEARCH
========================= */

async function searchPlace() {

  const input =
    document.getElementById("searchInput");

  let query =
    input.value.trim();


  if (query === "") {

    showMessage(
      "⚠️ ആദ്യം ഒരു സ്ഥലം എഴുതുക."
    );

    return;
  }


  showMessage(
    "🔎 സ്ഥലം തിരയുന്നു..."
  );


  try {

    /*
      പല രീതിയിൽ search ചെയ്യും.
      അതുകൊണ്ട് Khab Al Hitam പോലുള്ള
      spelling വ്യത്യാസങ്ങളും പരിശോധിക്കും.
    */

    let searches = [

      query,

      query + ", Abu Dhabi, UAE",

      query + ", Abu Dhabi",

      query
        .replace(
          /khab al hitam/gi,
          "Khab Al Hitham"
        )
        + ", Abu Dhabi, UAE",

      query
        .replace(
          /khab al hitam street/gi,
          "Khab Al Hitam"
        )
        + ", Abu Dhabi, UAE"

    ];


    let found = null;


    /* Search one by one */

    for (let q of searches) {

      const url =
        "https://nominatim.openstreetmap.org/search?" +
        "format=json" +
        "&limit=10" +
        "&addressdetails=1" +
        "&countrycodes=ae" +
        "&q=" +
        encodeURIComponent(q);


      const response =
        await fetch(
          url,
          {
            headers: {
              "Accept":
                "application/json"
            }
          }
        );


      const data =
        await response.json();


      if (data.length > 0) {

        /*
          Abu Dhabi result ആദ്യം
        */

        found =
          data.find(item =>
            item.display_name
              .toLowerCase()
              .includes("abu dhabi")
          );


        if (!found) {

          found = data[0];

        }


        break;
      }
    }


    /* No result */

    if (!found) {

      showMessage(
        "❌ ഈ സ്ഥലം കണ്ടെത്താൻ കഴിഞ്ഞില്ല."
      );

      return;
    }


    /* Coordinates */

    const lat =
      parseFloat(found.lat);

    const lon =
      parseFloat(found.lon);


    destination = [
      lat,
      lon
    ];


    /* Move map */

    map.setView(
      [lat, lon],
      17
    );


    /* Remove old marker */

    if (marker) {

      map.removeLayer(marker);

    }


    /* New marker */

    marker =
      L.marker(
        [lat, lon]
      )
      .addTo(map)
      .bindPopup(
        "📍 " +
        found.display_name
      )
      .openPopup();


    showMessage(
      "✅ സ്ഥലം കണ്ടെത്തി!"
    );

  }

  catch (error) {

    console.log(error);

    showMessage(
      "❌ Search ചെയ്യാൻ കഴിഞ്ഞില്ല. Internet പരിശോധിക്കുക."
    );

  }

}


/* =========================
   MY LOCATION
========================= */

function myLocation() {

  if (!navigator.geolocation) {

    showMessage(
      "❌ Location support ഇല്ല."
    );

    return;
  }


  showMessage(
    "📍 നിങ്ങളുടെ സ്ഥലം കണ്ടെത്തുന്നു..."
  );


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;


      currentLocation = [
        lat,
        lon
      ];


      /* Move map */

      map.setView(
        [lat, lon],
        17
      );


      /* Remove old marker */

      if (marker) {

        map.removeLayer(marker);

      }


      /* Location marker */

      marker =
        L.marker(
          [lat, lon]
        )
        .addTo(map)
        .bindPopup(
          "📍 നിങ്ങളുടെ ഇപ്പോഴത്തെ സ്ഥലം"
        )
        .openPopup();


      showMessage(
        "✅ നിങ്ങളുടെ സ്ഥലം കണ്ടെത്തി!"
      );

    },


    function(error) {

      showMessage(
        "⚠️ Location permission അനുവദിക്കണം."
      );

    },


    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );

}


/* =========================
   ROUTE
========================= */

function makeRoute() {

  /* Location ഇല്ല */

  if (!currentLocation) {

    showMessage(
      "📍 ആദ്യം Location button അമർത്തുക."
    );

    return;
  }


  /* Destination ഇല്ല */

  if (!destination) {

    showMessage(
      "🔎 ആദ്യം ഒരു destination search ചെയ്യുക."
    );

    return;
  }


  /* Remove old route */

  if (routeControl) {

    map.removeControl(
      routeControl
    );

  }


  /* Create route */

  routeControl =
    L.Routing.control({

      waypoints: [

        L.latLng(
          currentLocation[0],
          currentLocation[1]
        ),

        L.latLng(
          destination[0],
          destination[1]
        )

      ],

      routeWhileDragging: false,

      showAlternatives: true,

      createMarker: function() {

        return null;

      }

    }).addTo(map);


  showMessage(
    "🚗 Route തയ്യാറാക്കുന്നു..."
  );

}


/* =========================
   ENTER KEY SEARCH
========================= */

document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        searchPlace();

      }

    }
  );

</script>

</body>
</html>
