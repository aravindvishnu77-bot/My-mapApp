<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>My Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
}

#map {
  width: 100%;
  height: 100%;
}

/* TOP SEARCH */

.top-card {
  position: absolute;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 24px);
  max-width: 600px;
  background: white;
  border-radius: 24px;
  padding: 12px;
  z-index: 1000;
  box-shadow: 0 4px 20px rgba(0,0,0,.25);
}

.search-row {
  display: flex;
  gap: 8px;
}

#searchInput {
  flex: 1;
  height: 55px;
  border: 1px solid #ddd;
  border-radius: 18px;
  padding: 0 16px;
  font-size: 17px;
  outline: none;
}

#searchInput:focus {
  border-color: #4285f4;
}

.search-button {
  width: 58px;
  height: 55px;
  border: 0;
  border-radius: 18px;
  background: #4285f4;
  color: white;
  font-size: 25px;
}

/* ROUTE */

.route-button {
  width: 100%;
  height: 52px;
  margin-top: 9px;
  border: 0;
  border-radius: 17px;
  background: #202124;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

/* MESSAGE */

.message {
  position: absolute;
  top: 145px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 45px);
  max-width: 560px;
  background: white;
  padding: 15px;
  border-radius: 18px;
  text-align: center;
  font-size: 17px;
  box-shadow: 0 3px 15px rgba(0,0,0,.25);
  z-index: 999;
  display: none;
}

/* LOCATION */

.location-button {
  position: absolute;
  right: 20px;
  bottom: 25px;
  width: 58px;
  height: 58px;
  border: none;
  border-radius: 50%;
  background: white;
  box-shadow: 0 3px 15px rgba(0,0,0,.30);
  font-size: 27px;
  z-index: 1000;
}

/* INFO CARD */

.place-card {
  position: absolute;
  bottom: 95px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 35px);
  max-width: 560px;
  background: white;
  border-radius: 20px;
  padding: 16px;
  z-index: 998;
  box-shadow: 0 3px 15px rgba(0,0,0,.25);
  display: none;
}

.place-name {
  font-size: 18px;
  font-weight: bold;
}

.place-address {
  margin-top: 6px;
  color: #666;
  font-size: 14px;
}

/* MOBILE */

@media(max-width:600px) {

  .top-card {
    top: 10px;
  }

  #searchInput {
    font-size: 16px;
  }

  .message {
    top: 140px;
    font-size: 16px;
  }

}

</style>

</head>

<body>

<div id="map"></div>


<!-- SEARCH -->

<div class="top-card">

  <div class="search-row">

    <input
      id="searchInput"
      type="text"
      placeholder="Search a place..."
      autocomplete="off">

    <button
      class="search-button"
      onclick="searchPlace()">
      🔍
    </button>

  </div>

  <button
    class="route-button"
    onclick="makeRoute()">
    🚗 Get Route
  </button>

</div>


<!-- MESSAGE -->

<div
  id="message"
  class="message">
</div>


<!-- PLACE INFO -->

<div
  id="placeCard"
  class="place-card">

  <div
    id="placeName"
    class="place-name">
  </div>

  <div
    id="placeAddress"
    class="place-address">
  </div>

</div>


<!-- LOCATION -->

<button
  class="location-button"
  onclick="myLocation()">
  📍
</button>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =========================
   VARIABLES
========================= */

let map;
let marker = null;
let userMarker = null;
let destination = null;
let routeLine = null;


/* =========================
   MAP
========================= */

map = L.map("map")
  .setView(
    [24.4539, 54.3773],
    12
  );


/* =========================
   MAP LAYER
========================= */

/*
  Esri Street Map
  English-style street map
*/

L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom: 19,
    attribution:
      "Tiles © Esri"
  }
).addTo(map);


/* =========================
   MESSAGE
========================= */

function showMessage(text) {

  const box =
    document.getElementById("message");

  box.innerHTML = text;

  box.style.display = "block";
}


function hideMessage() {

  document.getElementById("message")
    .style.display = "none";
}


/* =========================
   SEARCH
========================= */

async function searchPlace() {

  const input =
    document.getElementById("searchInput");

  const query =
    input.value.trim();


  if (query === "") {

    showMessage(
      "⚠️ Please enter a place name."
    );

    return;
  }


  showMessage(
    "🔎 Searching..."
  );


  try {

    const searches = [

      query + ", Abu Dhabi, UAE",

      query + ", UAE",

      query

    ];


    let found = null;


    for (let q of searches) {

      const url =
        "https://nominatim.openstreetmap.org/search?" +
        "format=json" +
        "&limit=10" +
        "&addressdetails=1" +
        "&accept-language=en" +
        "&q=" +
        encodeURIComponent(q);


      const response =
        await fetch(url);


      const data =
        await response.json();


      if (data.length > 0) {

        found =
          data.find(item =>
            item.display_name
              .toLowerCase()
              .includes("abu dhabi")
          ) || data[0];

        break;
      }
    }


    if (!found) {

      showMessage(
        "❌ Place not found."
      );

      return;
    }


    showPlace(found);

  }

  catch(error) {

    console.log(error);

    showMessage(
      "❌ Search failed. Check your internet connection."
    );

  }

}


/* =========================
   SHOW PLACE
========================= */

function showPlace(found) {

  const lat =
    parseFloat(found.lat);

  const lon =
    parseFloat(found.lon);


  destination =
    [lat, lon];


  map.setView(
    [lat, lon],
    17
  );


  if (marker) {

    map.removeLayer(marker);

  }


  marker =
    L.marker(
      [lat, lon]
    )
    .addTo(map)
    .bindPopup(
      "📍 " +
      cleanName(found)
    )
    .openPopup();


  /*
    Place card
  */

  document.getElementById(
    "placeName"
  ).innerText =
    "📍 " + cleanName(found);


  document.getElementById(
    "placeAddress"
  ).innerText =
    cleanAddress(found);


  document.getElementById(
    "placeCard"
  ).style.display =
    "block";


  showMessage(
    "✅ Place found!"
  );


  setTimeout(
    hideMessage,
    2500
  );

}


/* =========================
   CLEAN NAME
========================= */

function cleanName(found) {

  const a =
    found.address || {};


  return (
    a.road ||
    a.neighbourhood ||
    a.suburb ||
    a.city ||
    found.name ||
    "Selected place"
  );

}


/* =========================
   CLEAN ADDRESS
========================= */

function cleanAddress(found) {

  const a =
    found.address || {};


  const parts = [

    a.road,

    a.neighbourhood,

    a.suburb,

    a.city,

    a.state,

    a.country

  ];


  return parts
    .filter(Boolean)
    .join(", ");

}


/* =========================
   MY LOCATION
========================= */

function myLocation() {

  if (!navigator.geolocation) {

    showMessage(
      "❌ Location is not supported."
    );

    return;
  }


  showMessage(
    "📍 Finding your location..."
  );


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;


      const location =
        [lat, lon];


      map.setView(
        location,
        17
      );


      if (userMarker) {

        map.removeLayer(
          userMarker
        );

      }


      userMarker =
        L.marker(location)
        .addTo(map)
        .bindPopup(
          "📍 Your current location"
        )
        .openPopup();


      showMessage(
        "✅ Your location found!"
      );


      setTimeout(
        hideMessage,
        2500
      );

    },


    function() {

      showMessage(
        "❌ Please allow location permission."
      );

    },


    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );

}


/* =========================
   ROUTE
========================= */

async function makeRoute() {

  if (!destination) {

    showMessage(
      "⚠️ Search for a place first."
    );

    return;
  }


  if (!navigator.geolocation) {

    showMessage(
      "❌ Location is not supported."
    );

    return;
  }


  showMessage(
    "🚗 Creating route..."
  );


  navigator.geolocation.getCurrentPosition(

    async function(position) {

      const startLat =
        position.coords.latitude;

      const startLon =
        position.coords.longitude;


      const endLat =
        destination[0];

      const endLon =
        destination[1];


      try {

        const url =
          "https://router.project-osrm.org/route/v1/driving/" +
          startLon + "," +
          startLat + ";" +
          endLon + "," +
          endLat +
          "?overview=full&geometries=geojson";


        const response =
          await fetch(url);


        const data =
          await response.json();


        if (
          !data.routes ||
          data.routes.length === 0
        ) {

          showMessage(
            "❌ Route not found."
          );

          return;
        }


        const route =
          data.routes[0];


        if (routeLine) {

          map.removeLayer(
            routeLine
          );

        }


        const coordinates =
          route.geometry.coordinates
          .map(point => [
            point[1],
            point[0]
          ]);


        routeLine =
          L.polyline(
            coordinates,
            {
              weight: 6,
              opacity: 0.85
            }
          ).addTo(map);


        map.fitBounds(
          routeLine.getBounds(),
          {
            padding: [40, 40]
          }
        );


        const distance =
          (
            route.distance / 1000
          ).toFixed(1);


        const minutes =
          Math.round(
            route.duration / 60
          );


        showMessage(
          "🚗 Route ready!<br>" +
          "📏 " + distance +
          " km &nbsp; • &nbsp; " +
          "⏱️ " + minutes +
          " min"
        );

      }

      catch(error) {

        console.log(error);

        showMessage(
          "❌ Could not create route."
        );

      }

    },


    function() {

      showMessage(
        "❌ Please allow location permission for route."
      );

    },


    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );

}


/* =========================
   ENTER TO SEARCH
========================= */

document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        searchPlace();

      }

    }
  );

</script>

</body>
</html>
