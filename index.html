<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Map</title>

<link
 rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
}

#map {
  width: 100%;
  height: 100vh;
}

/* TOP SEARCH BOX */
.search-panel {
  position: absolute;
  z-index: 1000;
  top: 18px;
  left: 20px;
  right: 20px;
  background: white;
  padding: 14px;
  border-radius: 24px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.25);
}

.search-row {
  display: flex;
  gap: 10px;
}

#searchInput {
  flex: 1;
  height: 58px;
  border: 1px solid #ccc;
  border-radius: 16px;
  padding: 0 16px;
  font-size: 18px;
  outline: none;
}

#searchInput:focus {
  border-color: #4285f4;
}

.search-btn {
  width: 86px;
  height: 58px;
  border: none;
  border-radius: 16px;
  background: #4285f4;
  color: white;
  font-size: 27px;
  cursor: pointer;
}

.route-btn {
  width: 100%;
  height: 58px;
  margin-top: 12px;
  border: none;
  border-radius: 17px;
  background: #222;
  color: white;
  font-size: 20px;
  cursor: pointer;
}

.route-btn:active,
.search-btn:active {
  transform: scale(0.98);
}

/* MESSAGE */
#message {
  display: none;
  margin-top: 10px;
  padding: 14px;
  background: white;
  border-radius: 18px;
  text-align: center;
  font-size: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.2);
}

/* LOCATION BUTTON */
.location-btn {
  position: absolute;
  z-index: 1000;
  right: 18px;
  bottom: 25px;
  width: 62px;
  height: 62px;
  border: none;
  border-radius: 50%;
  background: white;
  box-shadow: 0 3px 15px rgba(0,0,0,0.25);
  font-size: 30px;
  cursor: pointer;
}

/* ROUTE INFO */
#routeInfo {
  display: none;
  position: absolute;
  z-index: 1001;
  left: 20px;
  right: 20px;
  bottom: 20px;
  background: white;
  border-radius: 18px;
  padding: 16px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.3);
  font-size: 17px;
}

/* MOBILE */
@media (max-width: 600px) {

  .search-panel {
    top: 14px;
    left: 14px;
    right: 14px;
    padding: 12px;
  }

  #searchInput {
    font-size: 17px;
  }

  .search-btn {
    width: 72px;
  }
}
</style>
</head>

<body>

<div id="map"></div>

<div class="search-panel">

  <div class="search-row">

    <input
      id="searchInput"
      type="text"
      placeholder="സ്ഥലം അല്ലെങ്കിൽ Street തിരയുക"
    >

    <button
      class="search-btn"
      onclick="searchPlace()">
      🔎
    </button>

  </div>

  <button
    class="route-btn"
    onclick="makeRoute()">
    🚗 Route
  </button>

  <div id="message"></div>

</div>

<button
 class="location-btn"
 onclick="findMyLocation()">
 📍
</button>

<div id="routeInfo"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================
   MAP
========================= */

const map = L.map("map").setView(
  [24.4539, 54.3773],
  11
);

/*
   English-style street map
*/
L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom: 19,
    attribution: "© Esri"
  }
).addTo(map);


/* =========================
   VARIABLES
========================= */

let marker = null;
let destination = null;
let userLocation = null;
let routeLine = null;


/* =========================
   MESSAGE
========================= */

function showMessage(text) {

  const box = document.getElementById("message");

  box.innerHTML = text;
  box.style.display = "block";

}


/* =========================
   SEARCH PLACE
========================= */

async function searchPlace() {

  const input =
    document.getElementById("searchInput");

  let query =
    input.value.trim();

  if (query === "") {

    showMessage(
      "⚠️ ആദ്യം ഒരു സ്ഥലം എഴുതുക."
    );

    return;
  }


  showMessage(
    "🔎 സ്ഥലം തിരയുന്നു..."
  );


  try {

    /*
      Abu Dhabi priority
    */

    const searches = [

      query,

      query + ", Abu Dhabi, UAE",

      query + ", Bani Yas, Abu Dhabi, UAE"

    ];


    let found = null;


    for (const q of searches) {

      const url =
        "https://nominatim.openstreetmap.org/search?" +
        "format=json" +
        "&limit=10" +
        "&addressdetails=1" +
        "&countrycodes=ae" +
        "&q=" +
        encodeURIComponent(q);


      const response =
        await fetch(url, {
          headers: {
            "Accept":
              "application/json"
          }
        });


      if (!response.ok) {
        continue;
      }


      const data =
        await response.json();


      if (data.length > 0) {

        /*
          Prefer Abu Dhabi result
        */

        found =
          data.find(item => {

            const text =
              (
                item.display_name +
                " " +
                (item.address?.city || "") +
                " " +
                (item.address?.state || "")
              ).toLowerCase();

            return (
              text.includes("abu dhabi") ||
              text.includes("bani yas")
            );

          }) || data[0];


        if (found) {
          break;
        }
      }
    }


    if (!found) {

      showMessage(
        "❌ ഈ സ്ഥലം കണ്ടെത്താൻ കഴിഞ്ഞില്ല."
      );

      return;
    }


    const lat =
      parseFloat(found.lat);

    const lon =
      parseFloat(found.lon);


    destination = [lat, lon];


    /*
      Move map
    */

    map.setView(
      [lat, lon],
      17
    );


    /*
      Remove old marker
    */

    if (marker) {

      map.removeLayer(marker);

    }


    /*
      Add new marker
    */

    marker =
      L.marker([lat, lon])
      .addTo(map);


    /*
      Popup
    */

    marker
      .bindPopup(
        "📍 " +
        cleanPlaceName(found)
      )
      .openPopup();


    showMessage(
      "✅ സ്ഥലം കണ്ടെത്തി!"
    );

  }

  catch (error) {

    console.log(error);

    showMessage(
      "❌ Search ചെയ്യാൻ കഴിഞ്ഞില്ല. Internet പരിശോധിക്കുക."
    );

  }

}


/* =========================
   CLEAN PLACE NAME
========================= */

function cleanPlaceName(place) {

  if (
    place.address &&
    place.address.road
  ) {

    let name =
      place.address.road;

    if (place.address.city) {
      name +=
        ", " +
        place.address.city;
    }

    return name;
  }

  return place.display_name;
}


/* =========================
   ENTER KEY SEARCH
========================= */

document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        searchPlace();

      }

    }
  );


/* =========================
   MY LOCATION
========================= */

function findMyLocation() {

  if (!navigator.geolocation) {

    showMessage(
      "❌ നിങ്ങളുടെ ഫോണിൽ Location support ഇല്ല."
    );

    return;
  }


  showMessage(
    "📍 നിങ്ങളുടെ സ്ഥലം കണ്ടെത്തുന്നു..."
  );


  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;


      userLocation = [
        lat,
        lon
      ];


      map.setView(
        [lat, lon],
        17
      );


      L.marker(
        [lat, lon]
      )
      .addTo(map)
      .bindPopup(
        "📍 നിങ്ങളുടെ ഇപ്പോഴത്തെ സ്ഥലം"
      )
      .openPopup();


      showMessage(
        "✅ നിങ്ങളുടെ സ്ഥലം കണ്ടെത്തി!"
      );

    },

    function(error) {

      console.log(error);

      showMessage(
        "❌ Location അനുവദിച്ചിട്ടില്ല."
      );

    },

    {
      enableHighAccuracy: true,
      timeout: 10000
    }

  );

}


/* =========================
   ROUTE
========================= */

async function makeRoute() {

  if (!destination) {

    showMessage(
      "⚠️ ആദ്യം ഒരു സ്ഥലം Search ചെയ്യുക."
    );

    return;
  }


  /*
    If user location already known
  */

  if (!userLocation) {

    if (!navigator.geolocation) {

      showMessage(
        "❌ നിങ്ങളുടെ Location ലഭ്യമല്ല."
      );

      return;
    }


    showMessage(
      "📍 നിങ്ങളുടെ Location എടുക്കുന്നു..."
    );


    navigator.geolocation.getCurrentPosition(

      function(position) {

        userLocation = [
          position.coords.latitude,
          position.coords.longitude
        ];

        calculateRoute();

      },

      function() {

        showMessage(
          "❌ Route കാണിക്കാൻ Location അനുവദിക്കണം."
        );

      },

      {
        enableHighAccuracy: true,
        timeout: 10000
      }

    );

  } else {

    calculateRoute();

  }

}


/* =========================
   CALCULATE ROUTE
========================= */

async function calculateRoute() {

  showMessage(
    "🚗 Route കണ്ടെത്തുന്നു..."
  );


  const start =
    userLocation;

  const end =
    destination;


  const url =
    "https://router.project-osrm.org/route/v1/driving/" +
    start[1] +
    "," +
    start[0] +
    ";" +
    end[1] +
    "," +
    end[0] +
    "?overview=full&geometries=geojson";


  try {

    const response =
      await fetch(url);


    const data =
      await response.json();


    if (
      !data.routes ||
      data.routes.length === 0
    ) {

      showMessage(
        "❌ Route കണ്ടെത്താൻ കഴിഞ്ഞില്ല."
      );

      return;
    }


    const route =
      data.routes[0];


    /*
      Remove old route
    */

    if (routeLine) {

      map.removeLayer(
        routeLine
      );

    }


    /*
      Draw route
    */

    routeLine =
      L.geoJSON(
        route.geometry,
        {
          weight: 6
        }
      )
      .addTo(map);


    /*
      Fit map
    */

    map.fitBounds(
      routeLine.getBounds(),
      {
        padding: [40, 40]
      }
    );


    /*
      Distance
    */

    const distanceKm =
      (
        route.distance / 1000
      ).toFixed(1);


    /*
      Time
    */

    const minutes =
      Math.round(
        route.duration / 60
      );


    document
      .getElementById("routeInfo")
      .innerHTML =
      "🚗 <b>Route Ready</b><br>" +
      "📏 Distance: " +
      distanceKm +
      " km<br>" +
      "⏱️ ഏകദേശം സമയം: " +
      minutes +
      " minutes";


    document
      .getElementById("routeInfo")
      .style.display =
      "block";


    showMessage(
      "✅ Route കണ്ടെത്തി!"
    );

  }

  catch (error) {

    console.log(error);

    showMessage(
      "❌ Route ലഭിച്ചില്ല. Internet പരിശോധിക്കുക."
    );

  }

}

</script>

</body>
</html>
