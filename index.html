<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
font-family:Arial,sans-serif;
}

#map{
width:100%;
height:100vh;
}

.search-panel{
position:absolute;
z-index:1000;
top:15px;
left:15px;
right:15px;
background:white;
padding:14px;
border-radius:22px;
box-shadow:0 4px 18px rgba(0,0,0,.25);
}

.search-row{
display:flex;
gap:8px;
}

#searchInput{
flex:1;
height:55px;
border:1px solid #ccc;
border-radius:15px;
padding:0 15px;
font-size:17px;
outline:none;
}

.search-btn{
width:65px;
height:55px;
border:0;
border-radius:15px;
background:#4285f4;
color:white;
font-size:25px;
}

.route-btn{
width:100%;
height:52px;
margin-top:10px;
border:0;
border-radius:15px;
background:#222;
color:white;
font-size:18px;
font-weight:bold;
}

#message{
display:none;
margin-top:10px;
padding:12px;
border-radius:15px;
text-align:center;
font-size:16px;
background:#f5f5f5;
}

.location-btn{
position:absolute;
z-index:1000;
right:18px;
bottom:25px;
width:60px;
height:60px;
border:0;
border-radius:50%;
background:white;
font-size:28px;
box-shadow:0 3px 15px rgba(0,0,0,.3);
}

#routeInfo{
display:none;
position:absolute;
z-index:1001;
left:15px;
right:15px;
bottom:15px;
background:white;
padding:15px;
border-radius:18px;
box-shadow:0 4px 18px rgba(0,0,0,.3);
font-size:16px;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="search-panel">

<div class="search-row">

<input
id="searchInput"
type="text"
placeholder="Search place or street">

<button
class="search-btn"
onclick="searchPlace()">🔎</button>

</div>

<button
class="route-btn"
onclick="makeRoute()">
🚗 Route
</button>

<div id="message"></div>

</div>

<button
class="location-btn"
onclick="findMyLocation()">
📍
</button>

<div id="routeInfo"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* MAP */

const map = L.map("map").setView(
[24.4539,54.3773],
12
);

/* ENGLISH MAP */

L.tileLayer(
"https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
{
maxZoom:19,
attribution:"© Esri"
}
).addTo(map);


/* VARIABLES */

let marker=null;
let destination=null;
let userLocation=null;
let routeLine=null;


/* MESSAGE */

function showMessage(text){

const box=document.getElementById("message");

box.innerHTML=text;
box.style.display="block";

}


/* SEARCH */

async function searchPlace(){

let query=
document.getElementById("searchInput")
.value
.trim();

if(query===""){

showMessage("⚠️ Enter a place or street.");

return;

}

showMessage("🔎 Searching...");


/*
Special handling for
Khab Al Hitam Street
*/

if(
query.toLowerCase().includes("khab al hitam") ||
query.toLowerCase().includes("khab al hitham")
){

query="Khab Al Hitham Street, Abu Dhabi, UAE";

}


try{

const url=
"https://nominatim.openstreetmap.org/search?" +
"format=json" +
"&q="+
encodeURIComponent(query)+
"&limit=10" +
"&addressdetails=1" +
"&countrycodes=ae";


const response=
await fetch(url,{
headers:{
"Accept":"application/json"
}
});


if(!response.ok){

throw new Error("Search error");

}


const data=
await response.json();


if(data.length===0){

showMessage(
"❌ Place not found. Try another spelling."
);

return;

}


/*
Prefer Abu Dhabi
*/

let found=
data.find(item=>
(item.display_name||"")
.toLowerCase()
.includes("abu dhabi")
) || data[0];


const lat=parseFloat(found.lat);
const lon=parseFloat(found.lon);

destination=[lat,lon];


/* MOVE MAP */

map.setView(
[lat,lon],
17
);


/* REMOVE OLD MARKER */

if(marker){

map.removeLayer(marker);

}


/* NEW MARKER */

marker=
L.marker([lat,lon])
.addTo(map);


/* NAME */

let name="Selected place";

if(found.address){

if(found.address.road){

name=found.address.road;

}

else if(found.name){

name=found.name;

}

}

marker
.bindPopup("📍 "+name)
.openPopup();


showMessage(
"✅ Place found!"
);

}

catch(error){

console.log(error);

showMessage(
"❌ Search failed. Check your internet."
);

}

}


/* ENTER KEY */

document
.getElementById("searchInput")
.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

searchPlace();

}

});


/* MY LOCATION */

function findMyLocation(){

if(!navigator.geolocation){

showMessage(
"❌ Location is not supported."
);

return;

}

showMessage(
"📍 Finding your location..."
);


navigator.geolocation.getCurrentPosition(

function(position){

const lat=
position.coords.latitude;

const lon=
position.coords.longitude;

userLocation=[lat,lon];

map.setView(
[lat,lon],
17
);


L.marker([lat,lon])
.addTo(map)
.bindPopup(
"📍 Your current location"
)
.openPopup();


showMessage(
"✅ Your location found!"
);

},

function(){

showMessage(
"❌ Please allow location permission."
);

},

{
enableHighAccuracy:true,
timeout:10000
}

);

}


/* ROUTE */

function makeRoute(){

if(!destination){

showMessage(
"⚠️ Search a destination first."
);

return;

}


if(!navigator.geolocation){

showMessage(
"❌ Location is not available."
);

return;

}


showMessage(
"📍 Getting your location..."
);


navigator.geolocation.getCurrentPosition(

function(position){

userLocation=[
position.coords.latitude,
position.coords.longitude
];

calculateRoute();

},

function(){

showMessage(
"❌ Please allow location permission."
);

},

{
enableHighAccuracy:true,
timeout:10000
}

);

}


/* ROUTE CALCULATION */

async function calculateRoute(){

showMessage(
"🚗 Creating route..."
);


const start=userLocation;
const end=destination;


const url=
"https://router.project-osrm.org/route/v1/driving/"+
start[1]+","+start[0]+";"+
end[1]+","+end[0]+
"?overview=full&geometries=geojson";


try{

const response=
await fetch(url);

const data=
await response.json();


if(
!data.routes ||
data.routes.length===0
){

showMessage(
"❌ Route not found."
);

return;

}


const route=data.routes[0];


/* REMOVE OLD ROUTE */

if(routeLine){

map.removeLayer(routeLine);

}


/* DRAW ROUTE */

routeLine=
L.geoJSON(
route.geometry,
{
weight:6
}
).addTo(map);


/* FIT MAP */

map.fitBounds(
routeLine.getBounds(),
{
padding:[40,40]
}
);


/* DISTANCE */

const distance=
(route.distance/1000)
.toFixed(1);


/* TIME */

const minutes=
Math.round(route.duration/60);


/* INFO */

document
.getElementById("routeInfo")
.innerHTML=
"🚗 <b>Route Ready</b><br>"+
"📏 Distance: "+
distance+
" km<br>"+
"⏱️ Time: "+
minutes+
" minutes";


document
.getElementById("routeInfo")
.style.display="block";


showMessage(
"✅ Route ready!"
);

}

catch(error){

console.log(error);

showMessage(
"❌ Could not create route."
);

}

}

</script>

</body>
</html>
