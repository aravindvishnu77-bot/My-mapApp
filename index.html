<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>എന്റെ മാപ്പ്</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<link rel="stylesheet"
href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css"/>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:Arial,sans-serif;
}

#map{
  width:100%;
  height:100%;
}

/* മുകളിൽ ഉള്ള Search Box */

.search-box{
  position:absolute;
  top:15px;
  left:15px;
  right:15px;
  z-index:1000;
  background:white;
  padding:12px;
  border-radius:18px;
  box-shadow:0 3px 15px #777;
}

.search-row{
  display:flex;
  gap:8px;
}

#searchInput{
  flex:1;
  padding:14px;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

button{
  border:none;
  border-radius:12px;
  padding:12px 16px;
  font-size:16px;
  cursor:pointer;
}

.search-btn{
  background:#4285f4;
  color:white;
}

.route-btn{
  background:#222;
  color:white;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.buttons button{
  flex:1;
}

/* Current Location */

.location-btn{
  position:absolute;
  bottom:30px;
  right:20px;
  z-index:1000;

  width:58px;
  height:58px;

  border-radius:50%;
  background:white;

  box-shadow:0 3px 12px #777;

  font-size:25px;
}

/* Malayalam message */

.message{
  position:absolute;
  top:135px;
  left:20px;
  right:20px;
  z-index:1000;

  background:white;
  padding:12px;

  border-radius:12px;

  box-shadow:0 2px 10px #777;

  display:none;
  text-align:center;

  font-size:15px;
}

</style>
</head>

<body>

<!-- Search -->

<div class="search-box">

  <div class="search-row">

    <input
      id="searchInput"
      type="text"
      placeholder="സ്ഥലം അല്ലെങ്കിൽ Street തിരയുക..."
    >

    <button
      class="search-btn"
      onclick="searchPlace()">
      🔎
    </button>

  </div>

  <div class="buttons">

    <button
      class="route-btn"
      onclick="makeRoute()">
      🚗 Route
    </button>

  </div>

</div>

<!-- Message -->

<div id="message" class="message"></div>

<!-- Location -->

<button
  class="location-btn"
  onclick="myLocation()">
  📍
</button>

<!-- Map -->

<div id="map"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js">
</script>


<script>

/* =========================
   MAP START
========================= */

let map;
let marker;
let currentLocation = null;
let destination = null;
let routeControl = null;


/* Abu Dhabi default location */

const defaultLocation = [
  24.4539,
  54.3773
];


map = L.map("map").setView(defaultLocation, 12);


/* OpenStreetMap */

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:
    '&copy; OpenStreetMap contributors'
  }
).addTo(map);


/* Default marker */

marker = L.marker(defaultLocation)
  .addTo(map)
  .bindPopup("📍 അബുദാബി")
  .openPopup();


/* =========================
   MESSAGE
========================= */

function showMessage(text){

  const box =
    document.getElementById("message");

  box.innerText = text;

  box.style.display = "block";

  setTimeout(function(){

    box.style.display = "none";

  },3000);
}


/* =========================
   SEARCH PLACE
========================= */

async function searchPlace(){

  const input =
    document.getElementById("searchInput");

  let query =
    input.value.trim();


  if(query === ""){

    showMessage(
      "⚠️ ആദ്യം ഒരു സ്ഥലം എഴുതുക."
    );

    return;
  }


  showMessage(
    "🔎 സ്ഥലം തിരയുന്നു..."
  );


  try{

    /*
      Nominatim search
    */

    const url =
      "https://nominatim.openstreetmap.org/search?" +
      "format=json&limit=1&addressdetails=1&q=" +
      encodeURIComponent(query);


    const response =
      await fetch(url,{
        headers:{
          "Accept":"application/json"
        }
      });


    const data =
      await response.json();


    if(data.length === 0){

      showMessage(
        "❌ ഈ സ്ഥലം കണ്ടെത്താൻ കഴിഞ്ഞില്ല."
      );

      return;
    }


    const place = data[0];


    const lat =
      parseFloat(place.lat);

    const lon =
      parseFloat(place.lon);


    destination = [
      lat,
      lon
    ];


    /*
      Map destination
    */

    map.setView(
      [lat,lon],
      17
    );


    /*
      Remove old marker
    */

    if(marker){

      map.removeLayer(marker);

    }


    /*
      New marker
    */

    marker =
      L.marker([lat,lon])
      .addTo(map)
      .bindPopup(
        "📍 " +
        place.display_name
      )
      .openPopup();


    showMessage(
      "✅ സ്ഥലം കണ്ടെത്തി!"
    );

  }

  catch(error){

    console.log(error);

    showMessage(
      "❌ Search ചെയ്യാൻ കഴിഞ്ഞില്ല. Internet പരിശോധിക്കുക."
    );

  }

}


/* =========================
   CURRENT LOCATION
========================= */

function myLocation(){

  if(!navigator.geolocation){

    showMessage(
      "❌ നിങ്ങളുടെ ഫോണിൽ Location support ഇല്ല."
    );

    return;
  }


  showMessage(
    "📍 നിങ്ങളുടെ സ്ഥലം കണ്ടെത്തുന്നു..."
  );


  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;


      currentLocation = [
        lat,
        lon
      ];


      map.setView(
        [lat,lon],
        17
      );


      if(marker){

        map.removeLayer(marker);

      }


      marker =
        L.marker([lat,lon])
        .addTo(map)
        .bindPopup(
          "📍 നിങ്ങളുടെ ഇപ്പോഴത്തെ സ്ഥലം"
        )
        .openPopup();


      showMessage(
        "✅ നിങ്ങളുടെ സ്ഥലം കണ്ടെത്തി!"
      );

    },


    function(error){

      showMessage(
        "⚠️ Location permission അനുവദിക്കണം."
      );

    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }

  );

}


/* =========================
   ROUTE
========================= */

function makeRoute(){

  if(!currentLocation){

    showMessage(
      "📍 ആദ്യം Location button അമർത്തുക."
    );

    return;
  }


  if(!destination){

    showMessage(
      "🔎 ആദ്യം ഒരു destination search ചെയ്യുക."
    );

    return;
  }


  /*
    Remove previous route
  */

  if(routeControl){

    map.removeControl(routeControl);

  }


  /*
    Create route
  */

  routeControl =
    L.Routing.control({

      waypoints:[

        L.latLng(
          currentLocation[0],
          currentLocation[1]
        ),

        L.latLng(
          destination[0],
          destination[1]
        )

      ],

      routeWhileDragging:false,

      showAlternatives:true,

      language:"en",

      createMarker:function(){

        return null;

      }

    }).addTo(map);


  showMessage(
    "🚗 Route തയ്യാറാക്കുന്നു..."
  );

}


/* =========================
   ENTER KEY SEARCH
========================= */

document
.getElementById("searchInput")
.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      searchPlace();

    }

  }
);

</script>

</body>
</html>
